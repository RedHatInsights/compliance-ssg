name: SSG Content Update

on:
  schedule:
    # Run daily at 2:17 AM UTC (off-peak to avoid API congestion)
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'SSG version (e.g., v0.1.81) - leave empty to auto-detect latest'
        required: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Check for new version
        id: version
        run: |
          # If manual trigger, use provided version
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            echo "Manual trigger with version: $VERSION"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Get latest release from ComplianceAsCode/content
          LATEST_TAG=$(curl -s https://api.github.com/repos/ComplianceAsCode/content/releases/latest | jq -r '.tag_name')
          echo "Latest release from ComplianceAsCode/content: $LATEST_TAG"

          # Validate API response
          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            echo "Error: Failed to fetch latest release from API"
            exit 1
          fi

          if [[ ! "$LATEST_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Invalid version format: $LATEST_TAG"
            echo "Expected format: vX.Y.Z"
            exit 1
          fi

          # Get current version from Dockerfile
          CURRENT_VERSION=$(grep -oP 'ENV REVISION=\$\{REVISION:-\K[^}]+' src/content.Dockerfile || echo "none")
          echo "Current version in Dockerfile: $CURRENT_VERSION"

          # Validate we found a version
          if [ "$CURRENT_VERSION" = "none" ]; then
            echo "Error: Could not extract version from src/content.Dockerfile"
            exit 1
          fi

          # Compare versions
          if [ "$LATEST_TAG" = "$CURRENT_VERSION" ]; then
            echo "Already up to date with version $LATEST_TAG"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "New version detected: $CURRENT_VERSION -> $LATEST_TAG"
          echo "version=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Update state files
        if: steps.version.outputs.skip != 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          REVISION=$(date +%Y-%m-%d)

          # Update ssg-ansible-tasks.yaml
          sed -i "s|version: 0\.[0-9]\+\.[0-9]\+|version: ${VERSION#v}|g" content/ssg-ansible-tasks.yaml
          sed -i "s|/tarball/v[0-9.]\+|/tarball/$VERSION|g" content/ssg-ansible-tasks.yaml
          sed -i "s|revision: '.*'|revision: '$REVISION'|" content/ssg-ansible-tasks.yaml

          # Update ssg-datastreams.yaml
          sed -i "s|version: 0\.[0-9]\+\.[0-9]\+|version: ${VERSION#v}|g" content/ssg-datastreams.yaml
          sed -i "s|/tarball/v[0-9.]\+|/tarball/$VERSION|g" content/ssg-datastreams.yaml
          sed -i "s|revision: '.*'|revision: '$REVISION'|" content/ssg-datastreams.yaml

      - name: Update Dockerfile
        if: steps.version.outputs.skip != 'true'
        run: |
          sed -i "s|ENV REVISION=\${REVISION:-.*}|ENV REVISION=\${REVISION:-${{ steps.version.outputs.version }}}|" src/content.Dockerfile

      - name: Create Pull Request
        if: steps.version.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          commit-message: |
            chore(ssg): update to ${{ steps.version.outputs.version }}

            Auto-generated by SSG Update Bot
          committer: 'github-actions[bot] <github-actions[bot]@users.noreply.github.com>'
          author: 'github-actions[bot] <github-actions[bot]@users.noreply.github.com>'
          sign-commits: true
          branch: ssg-update-${{ steps.version.outputs.version }}
          delete-branch: true
          title: 'chore(ssg): update to ${{ steps.version.outputs.version }}'
          body: |
            ## SSG Content Update

            **Version:** ${{ steps.version.outputs.version }}
            **Source:** https://github.com/ComplianceAsCode/content/releases/tag/${{ steps.version.outputs.version }}

            ### Changes
            - Updated src/content.Dockerfile (build version)
            - Updated content/ssg-ansible-tasks.yaml (metadata)
            - Updated content/ssg-datastreams.yaml (metadata)

            ### Before Merging
            - [ ] Review [upstream release notes](https://github.com/ComplianceAsCode/content/releases/tag/${{ steps.version.outputs.version }})
            - [ ] Verify metadata files are correct

            ---
            🤖 Automated PR
